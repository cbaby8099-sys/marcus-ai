<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcus AI | CJ Technologies</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b14;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px;
  background: #111827;
  border-bottom: 1px solid #26334c;
}
h1 { margin: 0; color: #60a5fa; }
header p { color: #9ca3af; }
main { max-width: 650px; margin: auto; padding: 20px; }
.status { color: #4ade80; font-size: 13px; }
#chat {
  height: 55vh;
  min-height: 300px;
  overflow-y: auto;
  padding: 15px;
  background: #111827;
  border-radius: 14px;
  margin-top: 18px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.marcus { background: #1e293b; }
.user { background: #1d4ed8; margin-left: 35px; }
.controls { display: flex; gap: 8px; margin-top: 15px; }
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #111827;
  color: white;
}
button {
  padding: 12px 16px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-weight: bold;
}
.clear {
  background: #7f1d1d;
  margin-top: 12px;
}
footer { text-align: center; color: #64748b; margin-top: 25px; }
</style>
</head>
<body>
<header>
<h1>MARCUS AI</h1>
<p>Created by CJ Technologies</p>
</header>

<main>
<div class="status">● Marcus Memory System Active</div>

<div id="chat"></div>

<div class="controls">
<input id="message" placeholder="Talk to Marcus..."
onkeydown="if(event.key==='Enter') sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>

<button class="clear" onclick="clearChat()">Clear conversation</button>

<footer>Marcus AI · CJ Technologies · V2</footer>
</main>

<script>
const STORAGE_KEY = "marcus_conversation_v2";
const chat = document.getElementById("chat");

let history = [];

function saveMemory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (error) {
    console.log("Memory could not be saved.");
  }
}

function addMessage(sender, message) {
  const item = document.createElement("div");
  item.className = "message " + sender;
  const name = document.createElement("b");
  name.textContent = sender === "user" ? "You: " : "Marcus: ";
  item.appendChild(name);
  item.appendChild(document.createTextNode(message));
  chat.appendChild(item);
  chat.scrollTop = chat.scrollHeight;
}

function loadMemory() {
  try {
    history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    if (!Array.isArray(history)) history = [];
  } catch (error) {
    history = [];
  }

  if (history.length === 0) {
    history.push({
      sender: "marcus",
      message: "Hello! I am Marcus, created by CJ Technologies. My memory system is now active. My real AI brain is our next mission."
    });
    saveMemory();
  }

  history.forEach(item => addMessage(item.sender, item.message));
}

function sendMessage() {
  const input = document.getElementById("message");
  const value = input.value.trim();
  if (!value) return;

  history.push({sender: "user", message: value});
  addMessage("user", value);

  const reply = "I have saved your message in my memory. My real AI intelligence is still being connected.";

  history.push({sender: "marcus", message: reply});
  addMessage("marcus", reply);

  saveMemory();
  input.value = "";
}

function clearChat() {
  if (!confirm("Clear Marcus's saved conversation?")) return;
  history = [];
  saveMemory();
  chat.innerHTML = "";
  loadMemory();
}

loadMemory();
</script>
</body>
</html>
