
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b14;
  color: white;
}

header {
  background: #111827;
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #263247;
}

header h2 {
  color: #38bdf8;
  margin: 0;
}

#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  max-width: 85%;
  line-height: 1.5;
}

.user {
  background: #075985;
  margin-left: auto;
}

.bot {
  background: #1e293b;
  margin-right: auto;
}

.controls {
  display: flex;
  padding: 12px;
  gap: 8px;
  background: #111827;
}

input {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #263247;
  color: white;
  min-width: 0;
}

button {
  background: #0284c7;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h2>CJ AI</h2>
  <p>Your future AI assistant</p>
</header>

<div id="chat">
  <div class="message bot">
    Hello! I'm CJ AI V1. How can I help you today?
  </div>
</div>

<div class="controls">
  <input id="userInput" placeholder="Message CJ AI...">
  <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("userInput");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  chat.innerHTML +=
    '<div class="message user"></div>';

  chat.lastElementChild.textContent = message;

  input.value = "";

  let reply = "I'm CJ AI V1. I'm still learning. Tell me more!";

  if (message.toLowerCase().includes("hello")) {
    reply = "Hello! Welcome to CJ AI. What are we building today?";
  } else if (message.toLowerCase().includes("business")) {
    reply = "Let's build a successful business together!";
  } else if (message.toLowerCase().includes("money")) {
    reply = "Let's focus on creating value and building income.";
  }

  chat.innerHTML +=
    '<div class="message bot"></div>';

  chat.lastElementChild.textContent = reply;
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
