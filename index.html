<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Marcus AI personal assistant">
<link rel="manifest" href="./manifest.json">
<title>Marcus AI V9</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b12;color:#f4f6fc;
 font-family:Arial,sans-serif;min-height:100vh
}
header{
 padding:16px;background:#101725;border-bottom:1px solid #263247;
 display:flex;align-items:center;justify-content:space-between
}
.logo{font-size:23px;font-weight:bold;color:#76a9ff}
.status{font-size:12px;color:#63dc9a;margin-top:4px}
main{max-width:700px;margin:auto;padding:14px}
#chat{
 height:57vh;min-height:300px;overflow-y:auto;padding:12px;
 background:#0d1420;border:1px solid #253249;border-radius:15px
}
.msg{
 padding:12px 14px;margin:10px 0;border-radius:13px;
 line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere
}
.user{background:#19365e;margin-left:35px}
.marcus{background:#192333;margin-right:25px}
.system{text-align:center;color:#9baac0;font-size:12px}
.controls{display:flex;gap:8px;margin-top:12px}
textarea{
 flex:1;min-width:0;resize:none;height:54px;padding:14px;
 border-radius:12px;border:1px solid #34445c;
 background:#111c2c;color:white;font-size:15px
}
button{
 border:0;border-radius:10px;padding:12px;
 background:#2868d7;color:white;font-weight:bold
}
button:disabled{opacity:.5}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tools button{background:#202e43;font-size:12px}
select{
 background:#172338;color:white;border:1px solid #34445c;
 border-radius:8px;padding:9px
}
#preview{
 max-width:100%;max-height:180px;display:none;
 margin-top:10px;border-radius:10px
}
#thinking{display:none;color:#91a9d0;padding:8px}
</style>
</head>

<body>
<header>
 <div>
  <div class="logo">MARCUS AI</div>
  <div class="status">● Personal assistant</div>
 </div>
 <select id="voiceMode">
  <option value="on">Voice ON</option>
  <option value="off">Voice OFF</option>
 </select>
</header>

<main>
 <div id="chat">
  <div class="msg marcus">
   Marcus V9 is ready. What's on your mind?
  </div>
 </div>

 <div id="thinking">Marcus is thinking...</div>
 <img id="preview" alt="Selected image preview">

 <div class="controls">
  <textarea id="message" placeholder="Talk to Marcus..."></textarea>
  <button id="sendBtn" onclick="sendMessage()">SEND</button>
 </div>

 <div class="tools">
  <button onclick="startVoice()">🎙 Speak</button>
  <button onclick="document.getElementById('imageInput').click()">📷 Photo</button>
  <button onclick="showMemory()">🧠 Memory</button>
  <button onclick="exportMemory()">⬇ Export</button>
  <button onclick="clearChat()">Clear chat</button>
 </div>

 <input id="imageInput" type="file"
 accept="image/png,image/jpeg,image/webp" hidden>
</main>

<script>
const WORKER_URL="https://marcus-ai.cbaby8099.workers.dev";

const userId=localStorage.getItem("marcus_user_id")||
("marcus_"+Math.random().toString(36).slice(2));

localStorage.setItem("marcus_user_id",userId);

const chat=document.getElementById("chat");
const messageBox=document.getElementById("message");
const thinking=document.getElementById("thinking");
const sendBtn=document.getElementById("sendBtn");
const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");

let history=JSON.parse(
 sessionStorage.getItem("marcus_v7_history")||"[]"
);

let selectedImage=null;
let memory={};

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function getWorkerHistory(){
 return history.slice(-6).flatMap(item=>[
  {role:"user",content:item.user},
  {role:"assistant",content:item.marcus}
 ]);
}

function saveHistory(){
 history=history.slice(-10);
 sessionStorage.setItem(
  "marcus_v7_history",JSON.stringify(history)
 );
}

async function api(action,data={}){
 const response=await fetch(WORKER_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   action,
   userId,
   ...data
  })
 });

 const result=await response.json();

 if(!response.ok||result.success===false||result.error){
  throw new Error(result.error||"Marcus connection failed.");
 }

 return result;
}

async function sendMessage(){
 const text=messageBox.value.trim();

 if(!text&&!selectedImage)return;

 messageBox.value="";
 addMessage(text||"Please look at this image.","user");

 sendBtn.disabled=true;
 thinking.style.display="block";

 try{
  const result=await api("chat",{
   message:text,
   history:getWorkerHistory(),
   imageData:selectedImage
  });

  const reply=result.reply||
  "I couldn't generate a reply. Try again.";

  addMessage(reply,"marcus");

  history.push({
   user:text||"[Image sent]",
   marcus:reply
  });

  saveHistory();

  if(document.getElementById("voiceMode").value==="on"){
   speak(reply);
  }

  selectedImage=null;
  preview.style.display="none";
  imageInput.value="";

 }catch(error){
  addMessage("Connection error: "+error.message,"system");
 }finally{
  sendBtn.disabled=false;
  thinking.style.display="none";
 }
}

function speak(text){
 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.rate=1.05;
 utterance.pitch=1;

 speechSynthesis.speak(utterance);
}

function startVoice(){
 const SpeechRecognition=
 window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  addMessage(
   "Voice input is not supported in this browser.","system"
  );
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="en-ZA";
 recognition.interimResults=false;

 recognition.onresult=(event)=>{
  messageBox.value=event.results[0][0].transcript;
  sendMessage();
 };

 recognition.onerror=()=>{
  addMessage("Voice input failed. Try again.","system");
 };

 recognition.start();
}

imageInput.addEventListener("change",async()=>{
 const file=imageInput.files[0];
 if(!file)return;

 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
  addMessage("Please choose a JPG, PNG or WebP image.","system");
  return;
 }

 if(file.size>5*1024*1024){
  addMessage("Image must be smaller than 5 MB.","system");
  return;
 }

 try{
  const bitmap=await createImageBitmap(file);
  const canvas=document.createElement("canvas");

  const scale=Math.min(
   1,1100/Math.max(bitmap.width,bitmap.height)
  );

  canvas.width=Math.round(bitmap.width*scale);
  canvas.height=Math.round(bitmap.height*scale);

  canvas.getContext("2d").drawImage(
   bitmap,0,0,canvas.width,canvas.height
  );

  selectedImage=canvas.toDataURL("image/jpeg",0.78);

  preview.src=selectedImage;
  preview.style.display="block";

  bitmap.close();

 }catch(error){
  addMessage("Couldn't process this image.","system");
 }
});

async function showMemory(){
 try{
  const result=await api("get_memory");
  memory=result.memory||{};

  addMessage(
   "Marcus memory:\n"+JSON.stringify(memory,null,2),
   "marcus"
  );

 }catch(error){
  addMessage("Memory error: "+error.message,"system");
 }
}

async function exportMemory(){
 try{
  const result=await api("get_memory");
  memory=result.memory||{};

  const blob=new Blob(
   [JSON.stringify(memory,null,2)],
   {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download="marcus-memory.json";
  link.click();

  URL.revokeObjectURL(url);

 }catch(error){
  addMessage("Export failed: "+error.message,"system");
 }
}

function clearChat(){
 if(!confirm("Clear this chat history?"))return;

 history=[];
 sessionStorage.removeItem("marcus_v7_history");
 chat.innerHTML="";
 addMessage("Chat cleared. I'm ready.","marcus");
}

messageBox.addEventListener("keydown",(event)=>{
 if(event.key==="Enter"&&!event.shiftKey){
  event.preventDefault();
  sendMessage();
 }
});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .catch(error=>console.log("Service worker:",error));
 });
}
</script>
</body>
 </html>
