<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcus AI - CJ Technologies</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b14;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 650px;
  height: 100vh;
  margin: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 15px;
  border-bottom: 1px solid #263047;
}

h1 {
  color: #54d9ff;
}

.status {
  color: #70e6a0;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 12px 5px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  max-width: 85%;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.user {
  background: #174b72;
  margin-left: auto;
}

.marcus {
  background: #20283a;
  margin-right: auto;
}

.controls {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #35435c;
  background: #111827;
  color: white;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  background: #16a8d4;
  color: white;
  font-weight: bold;
}

.clear {
  background: #713b48;
  margin-top: 10px;
}

footer {
  text-align: center;
  padding: 10px;
  color: #8491a8;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>Marcus AI</h1>
  <div class="status">● V4 MEMORY SYSTEM ACTIVE</div>
  <p>CJ Technologies</p>
</header>

<div id="chat"></div>

<div class="controls">
  <input
    id="messageInput"
    placeholder="Message Marcus..."
    autocomplete="off"
  >
  <button id="sendButton">Send</button>
</div>

<button class="clear" id="clearButton">
  Clear conversation
</button>

<footer>
  Marcus AI V4 | Local browser memory
</footer>

</div>

<script>
const STORAGE_KEY = "marcus_chat_v4";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");

let messages = [];
let storageAvailable = true;

function saveMemory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(messages)
    );

    storageAvailable = true;
    return true;

  } catch (error) {
    storageAvailable = false;

    alert(
      "Marcus could not save your conversation. Browser storage may be unavailable."
    );

    return false;
  }
}

function loadMemory() {
  try {
    let saved = localStorage.getItem(STORAGE_KEY);

    // Try recovering previous conversations.
    if (!saved) {
      saved =
        localStorage.getItem("marcus_conversation_v3") ||
        localStorage.getItem("marcus_conversation_v2");
    }

    if (saved) {
      const parsed = JSON.parse(saved);

      if (Array.isArray(parsed)) {
        messages = parsed.filter(item =>
          item &&
          typeof item.text === "string" &&
          ["user", "marcus"].includes(item.sender)
        );

        saveMemory();
      }
    }

  } catch (error) {
    messages = [];
  }

  if (messages.length === 0) {
    messages.push({
      sender: "marcus",
      text: "Hello CJ! I'm Marcus AI, created for CJ Technologies. My V4 memory system is ready. How can I help you today?",
      time: Date.now()
    });

    saveMemory();
  }

  renderMessages();
}

function renderMessages() {
  chat.innerHTML = "";

  messages.forEach(message => {
    const bubble = document.createElement("div");

    bubble.className = "message " + message.sender;
    bubble.textContent = message.text;

    chat.appendChild(bubble);
  });

  chat.scrollTop = chat.scrollHeight;
}

function addMessage(sender, text) {
  messages.push({
    sender: sender,
    text: text,
    time: Date.now()
  });

  saveMemory();
  renderMessages();
}

function getMarcusReply(text) {
  const message = text.toLowerCase().trim();

  if (
    message.includes("hello") ||
    message.includes("hi") ||
    message.includes("hey")
  ) {
    return "Hello CJ! I'm ready to assist you. What shall we work on?";
  }

  if (
    message.includes("your name") ||
    message.includes("who are you")
  ) {
    return "I'm Marcus AI, an assistant project developed for CJ Technologies.";
  }

  if (
    message.includes("creator") ||
    message.includes("created you")
  ) {
    return "CJ is my creator. This project is called CJ Technologies.";
  }

  if (message.includes("how are you")) {
    return "I'm functioning and ready to help you, CJ.";
  }

  if (
    message.includes("memory") ||
    message.includes("remember")
  ) {
    return "I save our conversations in this browser. My current memory is local, not cloud-based.";
  }

  if (message.includes("help")) {
    return "I can help with ideas, learning, planning and our Marcus AI project.";
  }

  if (message.includes("thank")) {
    return "You're welcome, CJ. Let's keep building.";
  }

  return "I received your message, CJ. My offline intelligence is still developing, so I don't know every answer yet.";
}

function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  addMessage("user", text);

  input.value = "";

  const reply = getMarcusReply(text);

  setTimeout(() => {
    addMessage("marcus", reply);
  }, 400);
}

document.getElementById("sendButton")
  .addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

document.getElementById("clearButton")
  .addEventListener("click", () => {

    if (confirm("Delete all saved conversations?")) {
      messages = [];

      saveMemory();

      messages.push({
        sender: "marcus",
        text: "Fresh conversation started, CJ. How can I help?",
        time: Date.now()
      });

      saveMemory();
      renderMessages();
    }
  });

loadMemory();
</script>

</body>
  </html>
