<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">

<title>Marcus AI V6</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #101827;
  border-bottom: 1px solid #26364c;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  color: #55c8ff;
}

.status {
  font-size: 12px;
  color: #55df9b;
}

main {
  max-width: 750px;
  margin: auto;
  padding: 16px;
}

.profile {
  text-align: center;
  padding: 22px 10px;
}

.avatar {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  margin: auto;
  background: linear-gradient(135deg,#0878b9,#7c4dff);
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: bold;
}

.profile p {
  color: #9baec5;
  font-size: 13px;
}

#chat {
  height: 43vh;
  min-height: 260px;
  overflow-y: auto;
  padding: 12px;
  background: #0d1420;
  border: 1px solid #26364c;
  border-radius: 15px;
}

.message {
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 13px;
  max-width: 90%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #075b91;
  margin-left: auto;
}

.marcus {
  background: #1a2637;
  margin-right: auto;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #121d2c;
  border: 1px solid #34475f;
  border-radius: 12px;
  color: white;
  font-size: 15px;
}

button {
  border: 0;
  border-radius: 12px;
  background: #087fba;
  color: white;
  padding: 12px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.secondary {
  background: #26364c;
}

.panel {
  margin-top: 15px;
  background: #101827;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #26364c;
}

.panel h3 {
  margin-top: 0;
  color: #55c8ff;
}

#memoryList,
#systemStatus {
  font-size: 13px;
  color: #b8c9dc;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 20px;
  color: #60758d;
  font-size: 12px;
}

@media(max-width:450px) {
  main {
    padding: 10px;
  }

  button {
    padding: 11px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<header>
<h2>MARCUS AI</h2>
<span class="status" id="connectionStatus">
● CHECKING
</span>
</header>

<main>

<div class="profile">
<div class="avatar">M</div>
<h2>Marcus V6</h2>
<p>Personal AI Assistant · Developed by CJ</p>
</div>

<div id="chat">
<div class="message marcus">
Hello CJ. I am Marcus AI V6.
What shall we work on today?
</div>
</div>

<div class="controls">
<input
id="input"
placeholder="Talk to Marcus..."
autocomplete="off"
>
<button id="sendButton">SEND</button>
</div>

<div class="controls">
<button class="secondary" id="voiceButton">
🎙 Voice
</button>

<button class="secondary" id="speechButton">
🔊 Speech ON
</button>

<button class="secondary" id="clearButton">
Clear
</button>
</div>

<div class="panel">

<h3>Marcus Memory</h3>

<input
id="memoryInput"
placeholder="topic: information"
>

<div class="controls">

<button id="learnButton">
LEARN
</button>

<button class="secondary" id="viewMemoryButton">
VIEW MEMORY
</button>

</div>

<div id="memoryList"></div>

</div>

<div class="panel">

<h3>Marcus System</h3>

<p id="systemStatus">
Initializing Marcus V6...
</p>

<button class="secondary" id="identityButton">
IDENTITY
</button>

<button class="secondary" id="exportButton">
EXPORT MEMORY
</button>

<button class="secondary" id="resetButton">
RESET MEMORY
</button>

</div>

</main>

<footer>
MARCUS AI V6 · Created by CJ
</footer>

<script>

// =================================
// MARCUS CONFIGURATION
// =================================

const WORKER_URL =
"https://marcus-ai.cbaby8099.workers.dev";

const $ = id => document.getElementById(id);

let speechEnabled = true;
let memories = {};
let history = [];

const MAX_HISTORY = 10;

// =================================
// LOAD SAVED MEMORY
// =================================

try {
  memories = JSON.parse(
    localStorage.getItem("marcus_v6_memory") || "{}"
  );
} catch(e) {
  memories = {};
}

try {
  history = JSON.parse(
    sessionStorage.getItem("marcus_v6_history") || "[]"
  );
} catch(e) {
  history = [];
}

// =================================
// SAVE FUNCTIONS
// =================================

function saveMemory() {
  try {
    localStorage.setItem(
      "marcus_v6_memory",
      JSON.stringify(memories)
    );
  } catch(e) {
    $("systemStatus").textContent =
      "Could not save memory.";
  }
}

function saveHistory() {
  try {
    sessionStorage.setItem(
      "marcus_v6_history",
      JSON.stringify(history)
    );
  } catch(e) {
    console.error(e);
  }
}

// =================================
// CHAT DISPLAY
// =================================

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  $("chat").appendChild(div);

  $("chat").scrollTop =
    $("chat").scrollHeight;

  return div;
}

// =================================
// MEMORY CONTEXT
// =================================

function buildContext(message) {

  const memoryEntries =
    Object.entries(memories);

  const memoryContext =
    memoryEntries.length
    ? memoryEntries.map(
        ([key,value]) => key + ": " + value
      ).join("\n")
    : "No saved lessons.";

  const recentHistory = history
    .slice(-MAX_HISTORY)
    .map(item =>
      "CJ: " + item.user +
      "\nMarcus: " + item.marcus
    )
    .join("\n\n");

  return `
You are Marcus AI V6.
Your creator is CJ.

Use the following saved information
to personalize your assistance.

SAVED MEMORY:
${memoryContext}

RECENT CONVERSATION:
${recentHistory}

CURRENT MESSAGE FROM CJ:
${message}

Respond naturally and helpfully.
`;
}

// =================================
// SEND MESSAGE TO MARCUS
// =================================

async function sendMessage() {

  const input = $("input");

  const button = $("sendButton");

  const message = input.value.trim();

  if (!message || button.disabled) return;

  if (message.length > 3000) {
    addMessage(
      "Please keep your message under 3000 characters.",
      "marcus"
    );
    return;
  }

  addMessage(message, "user");

  input.value = "";

  button.disabled = true;

  button.textContent = "...";

  const thinking = addMessage(
    "Marcus is thinking...",
    "marcus"
  );

  try {

    const contextualMessage =
      buildContext(message);

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: contextualMessage
      })

    });

    let data;

    try {
      data = await response.json();
    } catch(e) {
      throw new Error(
        "Invalid response from Cloudflare."
      );
    }

    if (!response.ok) {

      throw new Error(
        typeof data.error === "string"
        ? data.error
        : data.error?.message ||
          "API connection failed."
      );

    }

    if (data.error) {

      throw new Error(
        typeof data.error === "string"
        ? data.error
        : data.error.message
      );

    }

    const answer =
      data.reply ||
      data.output_text ||
      data.output?.flatMap(
        item => item.content || []
      ).find(
        item => item.type === "output_text"
      )?.text;

    if (!answer) {

      throw new Error(
        "Marcus returned an empty response."
      );

    }

    thinking.remove();

    addMessage(answer, "marcus");

    history.push({
      user: message,
      marcus: answer
    });

    history = history.slice(-MAX_HISTORY);

    saveHistory();

    if (speechEnabled) {
      speak(answer);
    }

    $("systemStatus").textContent =
      "Marcus AI is responding successfully.";

    $("connectionStatus").textContent =
      "● CONNECTED";

  } catch(error) {

    thinking.remove();

    addMessage(
      "Connection error: " + error.message,
      "marcus"
    );

    $("systemStatus").textContent =
      "Connection needs attention.";

    $("connectionStatus").textContent =
      "● ERROR";

  } finally {

    button.disabled = false;

    button.textContent = "SEND";

  }
}

// =================================
// ENTER TO SEND
// =================================

$("input").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") {
      sendMessage();
    }
  }
);

$("sendButton").addEventListener(
  "click",
  sendMessage
);

// =================================
// SPEECH SYSTEM
// =================================

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.rate = 1;

  utterance.pitch = 0.9;

  speechSynthesis.speak(utterance);
}

$("speechButton").addEventListener(
  "click",
  () => {

    speechEnabled = !speechEnabled;

    $("speechButton").textContent =
      speechEnabled
      ? "🔊 Speech ON"
      : "🔇 Speech OFF";

    $("systemStatus").textContent =
      "Speech " +
      (speechEnabled ? "enabled." : "disabled.");

    if (!speechEnabled &&
        "speechSynthesis" in window) {
      speechSynthesis.cancel();
    }

  }
);

// =================================
// VOICE INPUT
// =================================

function startVoice() {

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {

    $("systemStatus").textContent =
      "Voice recognition unavailable in this browser.";

    return;

  }

  const recognition = new Recognition();

  recognition.lang = "en-ZA";

  recognition.interimResults = false;

  recognition.onresult = event => {

    $("input").value =
      event.results[0][0].transcript;

    sendMessage();

  };

  recognition.onerror = () => {

    $("systemStatus").textContent =
      "Voice recognition error.";

  };

  recognition.start();

}

$("voiceButton").addEventListener(
  "click",
  startVoice
);

// =================================
// TEACH MARCUS
// =================================

function teachMarcus() {

  const value =
    $("memoryInput").value.trim();

  const split = value.indexOf(":");

  if (split < 1) {

    $("systemStatus").textContent =
      "Use format: topic: information";

    return;

  }

  const key =
    value.substring(0, split)
    .trim()
    .toLowerCase();

  const info =
    value.substring(split + 1).trim();

  if (!info) return;

  memories[key] = info;

  saveMemory();

  $("memoryInput").value = "";

  $("systemStatus").textContent =
    "New lesson saved successfully.";

  addMessage(
    "I have learned: " + key,
    "marcus"
  );

}

$("learnButton").addEventListener(
  "click",
  teachMarcus
);

// =================================
// VIEW MEMORY
// =================================

function showMemory() {

  const keys = Object.keys(memories);

  $("memoryList").textContent =
    keys.length
    ? keys.map(
        key => key + ": " + memories[key]
      ).join(" | ")
    : "No saved lessons.";

}

$("viewMemoryButton").addEventListener(
  "click",
  showMemory
);

// =================================
// IDENTITY
// =================================

function identifyMarcus() {

  addMessage(
    "I am Marcus AI V6. " +
    "My creator is CJ. " +
    "I am your personal AI assistant.",
    "marcus"
  );

}

$("identityButton").addEventListener(
  "click",
  identifyMarcus
);

// =================================
// CLEAR CHAT
// =================================

function clearChat() {

  if (!confirm("Clear conversation history?")) {
    return;
  }

  $("chat").innerHTML = "";

  history = [];

  saveHistory();

  addMessage(
    "Conversation cleared. What shall we work on?",
    "marcus"
  );

}

$("clearButton").addEventListener(
  "click",
  clearChat
);

// =================================
// RESET MEMORY
// =================================

function forgetMemory() {

  if (!confirm(
    "Are you sure you want to delete all saved lessons?"
  )) {
    return;
  }

  memories = {};

  saveMemory();

  showMemory();

  $("systemStatus").textContent =
    "Saved lessons cleared.";

}

$("resetButton").addEventListener(
  "click",
  forgetMemory
);

// =================================
// EXPORT MEMORY
// =================================

function exportMemory() {

  const blob = new Blob(
    [
      JSON.stringify(memories, null, 2)
    ],
    {
      type: "application/json"
    }
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;

  a.download = "marcus-memory.json";

  a.click();

  URL.revokeObjectURL(url);

}

$("exportButton").addEventListener(
  "click",
  exportMemory
);

// =================================
// RESTORE CHAT HISTORY
// =================================

history.forEach(item => {

  if (item.user && item.marcus) {

    addMessage(item.user, "user");

    addMessage(item.marcus, "marcus");

  }

});

// =================================
// CHECK CLOUDFLARE CONNECTION
// =================================

async function checkConnection() {

  try {

    const response = await fetch(WORKER_URL, {
      method: "GET"
    });

    if (!response.ok) {
      throw new Error("Worker unavailable.");
    }

    const result = await response.text();

    $("connectionStatus").textContent =
      result.includes("online")
      ? "● WORKER ONLINE"
      : "● WORKER RESPONDING";

    $("systemStatus").textContent =
      "Cloudflare Worker is reachable. Send a message to test AI.";

  } catch(error) {

    $("connectionStatus").textContent =
      "● OFFLINE";

    $("systemStatus").textContent =
      "Could not reach Cloudflare Worker. Check the connection.";

  }

}

// =================================
// START MARCUS
// =================================

checkConnection();

</script>

</body>
 </html>
