<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcus AI V5</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  text-align: center;
  background: #101827;
  border-bottom: 1px solid #26354b;
}

header h1 {
  color: #00d9ff;
  margin: 5px;
}

.status {
  color: #54e69b;
  font-size: 13px;
}

#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  padding: 13px;
  margin: 12px 0;
  border-radius: 12px;
  max-width: 88%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.marcus {
  background: #172438;
  border-left: 3px solid #00d9ff;
}

.user {
  background: #174b65;
  margin-left: auto;
}

.controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 15px;
  background: #101827;
}

.input-row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #26354b;
  background: #080b12;
  color: white;
}

button {
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: #00bfe8;
  color: #001018;
  font-weight: bold;
}

.options {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 12px;
}

.options button {
  background: #26354b;
  color: white;
}

small {
  display: block;
  text-align: center;
  color: #8495aa;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
<h1>MARCUS AI</h1>
<div>Version 5.0</div>
<p class="status">● ONLINE — MEMORY ACTIVE</p>
</header>

<div id="chat"></div>

<div class="controls">

<div class="input-row">
<input id="input"
placeholder="Talk to Marcus..."
autocomplete="off">

<button onclick="sendMessage()">SEND</button>
</div>

<div class="options">
<button onclick="listen()">🎙️ TALK</button>
<button onclick="speakToggle()">🔊 VOICE</button>
<button onclick="clearChat()">CLEAR</button>
</div>

<small>Marcus AI V5 | Personal AI Assistant</small>

</div>

<script>

// MARCUS AI V5 CORE

const chat = document.getElementById("chat");
const input = document.getElementById("input");

let voiceEnabled = true;

let memory = JSON.parse(
 localStorage.getItem("marcus_memory") || "[]"
);

let history = JSON.parse(
 localStorage.getItem("marcus_history") || "[]"
);

function saveMemory() {
 localStorage.setItem(
  "marcus_memory",
  JSON.stringify(memory)
 );

 localStorage.setItem(
  "marcus_history",
  JSON.stringify(history)
 );
}

function displayMessage(text, sender) {

 const div = document.createElement("div");

 div.className = "message " + sender;

 div.textContent = text;

 chat.appendChild(div);

 chat.scrollTop = chat.scrollHeight;
}

function remember(text) {

 memory.push(text);

 if (memory.length > 30) {
  memory.shift();
 }

 saveMemory();
}

function speak(text) {

 if (!voiceEnabled) return;

 if (!("speechSynthesis" in window)) return;

 speechSynthesis.cancel();

 const speech = new SpeechSynthesisUtterance(text);

 speech.rate = 1;
 speech.pitch = 1;

 speechSynthesis.speak(speech);
}

function speakToggle() {

 voiceEnabled = !voiceEnabled;

 alert(
  voiceEnabled ? "Marcus voice ON" : "Marcus voice OFF"
 );
}

// CONVERSATION ENGINE

function think(message) {

 const text = message.toLowerCase();

 if (
  text.includes("hello") ||
  text.includes("hi") ||
  text.includes("hey")
 ) {
  return "Hello! I'm Marcus AI V5. How can I help you today?";
 }

 if (text.includes("your name")) {
  return "My name is Marcus. I am your personal AI assistant.";
 }

 if (text.includes("who created you")) {
  return "I am Marcus AI, created as part of your AI project.";
 }

 if (text.includes("how are you")) {
  return "My systems are running. What would you like us to work on?";
 }

 if (text.includes("remember")) {
  return "I can store information in my browser memory. Tell me what you want me to remember.";
 }

 if (text.includes("memory")) {
  return "My memory system is active. I can retain saved information in this browser.";
 }

 if (text.includes("trading")) {
  return "Let's analyse trading carefully. Are we studying forex, EURUSD, or your MT5 project?";
 }

 if (text.includes("mt5")) {
  return "MT5 development mode activated. We can work on your trading robot and analyse its code.";
 }

 if (text.includes("version")) {
  return "I am Marcus AI Version 5.0.";
 }

 if (text.includes("thank")) {
  return "You're welcome. What shall we work on next?";
 }

 if (text.includes("time")) {
  return "The current time on your device is " +
   new Date().toLocaleTimeString();
 }

 if (text.includes("what do you know about me")) {

  return memory.length
   ? "Here are some things I remember:\n" + memory.join("\n")
   : "I haven't saved any personal memories yet.";
 }

 return "I understand what you're saying. Tell me a little more so I can help you properly.";
}

// SEND MESSAGE

function sendMessage() {

 const message = input.value.trim();

 if (!message) return;

 displayMessage(message, "user");

 remember("User: " + message);

 history.push({
  role: "user",
  content: message
 });

 const response = think(message);

 setTimeout(() => {

  displayMessage(response, "marcus");

  history.push({
   role: "assistant",
   content: response
  });

  saveMemory();

  speak(response);

 }, 400);

 input.value = "";
}

input.addEventListener("keydown", function(event) {

 if (event.key === "Enter") {
  sendMessage();
 }

});

// VOICE RECOGNITION

function listen() {

 const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if (!Recognition) {
  alert("Voice recognition is not supported in this browser.");
  return;
 }

 const recognition = new Recognition();

 recognition.lang = "en-US";
 recognition.interimResults = false;

 recognition.onresult = function(event) {

  input.value = event.results[0][0].transcript;

  sendMessage();
 };

 recognition.onerror = function() {
  alert("Voice recognition failed. Try again.");
 };

 recognition.start();
}

// CLEAR CHAT

function clearChat() {

 if (!confirm("Clear Marcus conversation history?")) return;

 history = [];

 chat.innerHTML = "";

 localStorage.removeItem("marcus_history");

 displayMessage(
  "Conversation cleared. My saved memory remains.",
  "marcus"
 );
}

// RESTORE PREVIOUS CONVERSATION

if (history.length > 0) {

 history.forEach(item => {

  displayMessage(
   item.content,
   item.role === "user" ? "user" : "marcus"
  );

 });

} else {

 displayMessage(
  "Hello! I'm Marcus AI V5. My systems are online. How can I help you?",
  "marcus"
 );

}

</script>

</body>
  </html>
