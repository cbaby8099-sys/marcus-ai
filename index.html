
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>Marcus AI V7</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #101827;
  border-bottom: 1px solid #26364c;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 { margin: 0; color: #55c8ff; }

.status { font-size: 12px; color: #55df9b; }

main {
  max-width: 750px;
  margin: auto;
  padding: 16px;
}

.profile {
  text-align: center;
  padding: 22px 10px;
}

.avatar {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  margin: auto;
  background: linear-gradient(135deg,#0878b9,#7c4dff);
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: bold;
}

.profile p {
  color: #9baec5;
  font-size: 13px;
}

#chat {
  height: 43vh;
  min-height: 260px;
  overflow-y: auto;
  padding: 12px;
  background: #0d1420;
  border: 1px solid #26364c;
  border-radius: 15px;
}

.message {
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 13px;
  max-width: 90%;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #075b91;
  margin-left: auto;
}

.marcus {
  background: #1a2637;
  margin-right: auto;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: #121d2c;
  border: 1px solid #34475f;
  border-radius: 12px;
  color: white;
  font-size: 15px;
}

button {
  border: 0;
  border-radius: 12px;
  background: #087fba;
  color: white;
  padding: 12px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }
.secondary { background: #26364c; }

.panel {
  margin-top: 15px;
  background: #101827;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #26364c;
}

.panel h3 {
  margin-top: 0;
  color: #55c8ff;
}

#memoryList, #systemStatus {
  font-size: 13px;
  color: #b8c9dc;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.memory-entry {
  padding: 9px;
  margin: 7px 0;
  background: #0d1420;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #60758d;
  font-size: 12px;
}

@media(max-width:450px) {
  main { padding: 10px; }
  button { padding: 11px; font-size: 12px; }
}
</style>
</head>

<body>

<header>
  <h2>MARCUS AI</h2>
  <span class="status" id="connectionStatus">● CHECKING</span>
</header>

<main>

<div class="profile">
  <div class="avatar">M</div>
  <h2>Marcus V7</h2>
  <p>Personal AI Assistant · Developed by CJ</p>
</div>

<div id="chat">
  <div class="message marcus">
    Hello CJ. I am Marcus AI V7.
    My persistent memory system is ready.
    What shall we work on today?
  </div>
</div>

<div class="controls">
  <input id="input" placeholder="Talk to Marcus..." autocomplete="off">
  <button id="sendButton">SEND</button>
</div>

<div class="controls">
  <button class="secondary" id="voiceButton">🎙 Voice</button>
  <button class="secondary" id="speechButton">🔊 Speech ON</button>
  <button class="secondary" id="clearButton">Clear</button>
</div>

<div class="panel">
  <h3>Marcus Memory</h3>

  <input id="memoryInput" placeholder="topic: information">

  <div class="controls">
    <button id="learnButton">LEARN</button>
    <button class="secondary" id="viewMemoryButton">VIEW MEMORY</button>
  </div>

  <div id="memoryList">Loading saved memories...</div>
</div>

<div class="panel">
  <h3>Marcus System</h3>
  <p id="systemStatus">Initializing Marcus V7...</p>

  <button class="secondary" id="identityButton">IDENTITY</button>
  <button class="secondary" id="exportButton">EXPORT MEMORY</button>
  <button class="secondary" id="resetButton">RESET MEMORY</button>
</div>

</main>

<footer>MARCUS AI V7 · Created by CJ</footer>

<script>

// =================================
// CONFIGURATION
// =================================

const WORKER_URL =
"https://marcus-ai.cbaby8099.workers.dev";

const $ = id => document.getElementById(id);

let speechEnabled = true;
let busy = false;
let memories = {};
let history = [];

const MAX_HISTORY = 10;

// =================================
// ANONYMOUS USER ID
// =================================

function getMarcusUserId() {
  let id = localStorage.getItem("marcus_user_id");

  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("marcus_user_id", id);
  }

  return id;
}

const marcusUserId = getMarcusUserId();

// =================================
// RESTORE CHAT HISTORY
// =================================

try {
  history = JSON.parse(
    sessionStorage.getItem("marcus_v7_history") || "[]"
  );

  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

function saveHistory() {
  sessionStorage.setItem(
    "marcus_v7_history",
    JSON.stringify(history)
  );
}

// =================================
// WORKER REQUEST HELPER
// =================================

async function workerRequest(payload) {
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      ...payload,
      userId: marcusUserId
    })
  });

  const data = await response.json();

  if (!response.ok || data.error) {
    throw new Error(
      typeof data.error === "string"
        ? data.error
        : "Marcus request failed."
    );
  }

  return data;
}

// =================================
// CHAT DISPLAY
// =================================

function addMessage(text, type) {
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;

  return div;
}

// =================================
// DISPLAY SAVED MEMORY
// =================================

function showMemory() {
  const container = $("memoryList");
  container.innerHTML = "";

  const entries = Object.entries(memories);

  if (!entries.length) {
    container.textContent = "No saved memories yet.";
    return;
  }

  entries.forEach(([key, value]) => {
    const item = document.createElement("div");
    item.className = "memory-entry";

    const title = document.createElement("strong");
    title.textContent = key + ": ";

    const content = document.createElement("span");
    content.textContent = value;

    item.appendChild(title);
    item.appendChild(content);
    container.appendChild(item);
  });
}

// =================================
// LOAD MEMORY FROM CLOUDFLARE
// =================================

async function loadMemory() {
  try {
    const data = await workerRequest({
      action: "get_memory"
    });

    memories = data.memory || {};
    showMemory();

    $("systemStatus").textContent =
      "Persistent memory loaded successfully.";

  } catch (error) {
    $("memoryList").textContent =
      "Could not load memory: " + error.message;

    $("systemStatus").textContent =
      "Memory connection needs attention.";
  }
}

// =================================
// SAVE MEMORY TO CLOUDFLARE
// =================================

async function saveMemory() {
  const data = await workerRequest({
    action: "save_memory",
    memory: memories
  });

  memories = data.memory || memories;
  showMemory();

  return data;
}

// =================================
// LEARN NEW INFORMATION
// =================================

async function teachMarcus() {
  const value = $("memoryInput").value.trim();
  const split = value.indexOf(":");

  if (split < 1) {
    $("systemStatus").textContent =
      "Use format: topic: information";
    return;
  }

  const topic = value.substring(0, split).trim();
  const info = value.substring(split + 1).trim();

  if (!topic || !info) return;

  const button = $("learnButton");
  button.disabled = true;

  try {
    memories[topic] = info;

    await saveMemory();

    $("memoryInput").value = "";

    $("systemStatus").textContent =
      "Memory saved permanently.";

    addMessage(
      "I've saved this memory: " + topic + ": " + info,
      "marcus"
    );

  } catch (error) {
    $("systemStatus").textContent =
      "Could not save memory: " + error.message;
  } finally {
    button.disabled = false;
  }
}

$("learnButton").addEventListener("click", teachMarcus);

// =================================
// VIEW MEMORY
// =================================

$("viewMemoryButton").addEventListener("click", async () => {
  $("systemStatus").textContent = "Loading memories...";

  await loadMemory();

  addMessage(
    "Here are the memories currently saved for this browser.",
    "marcus"
  );
});

// =================================
// FORGET ALL MEMORY
// =================================

$("resetButton").addEventListener("click", async () => {
  if (!confirm("Delete all saved Marcus memories for this browser?")) {
    return;
  }

  const button = $("resetButton");
  button.disabled = true;

  try {
    await workerRequest({
      action: "delete_memory"
    });

    memories = {};
    showMemory();

    $("systemStatus").textContent =
      "All saved memories have been deleted.";

  } catch (error) {
    $("systemStatus").textContent =
      "Could not delete memory: " + error.message;
  } finally {
    button.disabled = false;
  }
});

// =================================
// SEND MESSAGE
// =================================

async function sendMessage(customMessage) {
  if (busy) return;

  const input = $("input");
  const button = $("sendButton");

  const message =
    typeof customMessage === "string"
      ? customMessage.trim()
      : input.value.trim();

  if (!message) return;

  if (message.length > 3000) {
    addMessage("Please keep your message under 3000 characters.", "marcus");
    return;
  }

  // Recognize explicit remember commands and save them directly.
  const rememberMatch = message.match(
    /^remember(?: that)?\s+(.+)$/i
  );

  if (rememberMatch) {
    busy = true;
    button.disabled = true;
    button.textContent = "...";

    addMessage(message, "user");
    if (!customMessage) input.value = "";

    try {
      const fact = rememberMatch[1].trim();

      if (fact.length > 1000) {
        throw new Error("That memory is too long.");
      }

      const duplicate = Object.values(memories).some(
        value => value.toLowerCase() === fact.toLowerCase()
      );

      if (!duplicate) {
        memories["fact_" + Date.now()] = fact;
        await saveMemory();
      }

      const answer = duplicate
        ? "I already have that information saved."
        : "I've saved that information to your persistent memory.";

      addMessage(answer, "marcus");

      history.push({ user: message, marcus: answer });
      history = history.slice(-MAX_HISTORY);
      saveHistory();

      if (speechEnabled) speak(answer);

      $("systemStatus").textContent = "Memory saved successfully.";

    } catch (error) {
      addMessage("Memory error: " + error.message, "marcus");
      $("systemStatus").textContent = error.message;
    } finally {
      busy = false;
      button.disabled = false;
      button.textContent = "SEND";
    }

    return;
  }

  // Recognize explicit forget commands.
  if (/^forget everything$/i.test(message)) {
    $("resetButton").click();
    return;
  }

  busy = true;
  button.disabled = true;
  button.textContent = "...";

  addMessage(message, "user");
  if (!customMessage) input.value = "";

  const thinking = addMessage("Marcus is thinking...", "marcus");

  try {
    const data = await workerRequest({
      message,
      history
    });

    const answer = data.reply;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error("Marcus returned an empty response.");
    }

    thinking.remove();
    addMessage(answer, "marcus");

    history.push({
      user: message,
      marcus: answer
    });

    history = history.slice(-MAX_HISTORY);
    saveHistory();

    if (speechEnabled) speak(answer);

    $("systemStatus").textContent =
      "Marcus V7 is responding successfully.";

    $("connectionStatus").textContent = "● CONNECTED";

  } catch (error) {
    thinking.remove();

    addMessage("Connection error: " + error.message, "marcus");

    $("systemStatus").textContent =
      "Connection needs attention.";

    $("connectionStatus").textContent = "● ERROR";

  } finally {
    busy = false;
    button.disabled = false;
    button.textContent = "SEND";
  }
}

// =================================
// SEND EVENTS
// =================================

$("sendButton").addEventListener("click", () => sendMessage());

$("input").addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});

// =================================
// SPEECH
// =================================

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 0.9;

  speechSynthesis.speak(utterance);
}

$("speechButton").addEventListener("click", () => {
  speechEnabled = !speechEnabled;

  $("speechButton").textContent =
    speechEnabled ? "🔊 Speech ON" : "🔇 Speech OFF";

  if (!speechEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

// =================================
// VOICE INPUT
// =================================

function startVoice() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    $("systemStatus").textContent =
      "Voice recognition unavailable in this browser.";
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "en-ZA";
  recognition.interimResults = false;

  recognition.onresult = event => {
    $("input").value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    $("systemStatus").textContent = "Voice recognition error.";
  };

  recognition.start();
}

$("voiceButton").addEventListener("click", startVoice);

// =================================
// IDENTITY
// =================================

$("identityButton").addEventListener("click", () => {
  addMessage(
    "I am Marcus AI V7, developed by CJ. I use Cloudflare Workers AI and persistent KV memory.",
    "marcus"
  );
});

// =================================
// CLEAR CHAT
// =================================

$("clearButton").addEventListener("click", () => {
  if (!confirm("Clear conversation history?")) return;

  $("chat").innerHTML = "";
  history = [];
  saveHistory();

  addMessage("Conversation cleared. What shall we work on?", "marcus");
});

// =================================
// EXPORT MEMORY
// =================================

$("exportButton").addEventListener("click", async () => {
  try {
    const data = await workerRequest({
      action: "get_memory"
    });

    const blob = new Blob(
      [JSON.stringify(data.memory || {}, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "marcus-memory.json";
    a.click();

    URL.revokeObjectURL(url);

    $("systemStatus").textContent = "Memory export created.";

  } catch (error) {
    $("systemStatus").textContent =
      "Export failed: " + error.message;
  }
});

// =================================
// RESTORE CHAT
// =================================

history.forEach(item => {
  if (item.user && item.marcus) {
    addMessage(item.user, "user");
    addMessage(item.marcus, "marcus");
  }
});

// =================================
// CHECK CONNECTION
// =================================

async function checkConnection() {
  try {
    const response = await fetch(WORKER_URL);

    if (!response.ok) throw new Error("Worker unavailable.");

    const result = await response.text();

    $("connectionStatus").textContent =
      result.toLowerCase().includes("online")
        ? "● WORKER ONLINE"
        : "● WORKER RESPONDING";

    $("systemStatus").textContent =
      "Cloudflare Worker reachable. Loading memory...";

    await loadMemory();

  } catch (error) {
    $("connectionStatus").textContent = "● OFFLINE";
    $("systemStatus").textContent =
      "Could not reach Cloudflare Worker.";
  }
}

// =================================
// START MARCUS
// =================================

checkConnection();

</script>
</body>
  </html>
